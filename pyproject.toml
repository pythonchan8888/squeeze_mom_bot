[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "smb"
version = "0.0.1"
description = "Automated Squeeze Momentum trading on Hyperliquid"
authors = [
  { name = "Jack Chan" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "boto3 >= 1.34.0",
    "duckdb >= 0.10.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "lz4 >= 4.3.0",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "websockets >= 11.0.0",
]
requires-python = ">=3.11,<3.13"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["smb"]
force-sort-within-sections = true

